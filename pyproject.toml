[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redactproof"
version = "0.1.0-alpha"
description = "Local-first screenshot sanitizer that red-teams its own output."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Redactproof Contributors" }]
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "streamlit>=1.30.0",
    "pymupdf>=1.23.0",
    "pypdf>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.80.0",
    "playwright>=1.40.0",
]
vision = [
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "rapidocr-onnxruntime>=1.3.0",
]

[project.scripts]
redactproof = "redactproof.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"redactproof.policy" = ["policies/*.json"]
"redactproof.review" = ["static/*"]

